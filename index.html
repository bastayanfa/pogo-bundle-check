<title>Bundle Value Check</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1620" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bundle Value Check" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/favicon.png" />
<style>
  :root {
    --bg: #0e1620;
    --panel: #16223a;
    --panel-2: #1c2c4a;
    --line: #2a3b52;
    --text: #f2f6ff;
    --text-dim: #9fb0d1;
    --text-faint: #62729a;
    --accent: #3fa6ff;
    --good: #4fd8a4;
    --bad: #ff7a68;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(14, 22, 32, 0.7), rgba(14, 22, 32, 0.7)),
      url('background.jpg') center/cover no-repeat var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    display: flex;
    justify-content: center;
    padding: 32px 16px 56px;
  }

  .page { width: 100%; max-width: 560px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .panel + .panel { margin-top: 14px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 8px;
    cursor: pointer;
    line-height: 1.3;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rows { display: flex; flex-direction: column; gap: 8px; }

  .compare-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .compare-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    text-align: right;
  }
  .compare-row input::placeholder { color: var(--text-faint); text-align: right; }
  .compare-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row-rank {
    flex-shrink: 0;
    width: 62px;
    text-align: right;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-faint);
  }
  .row-rank.good { color: var(--good); }
  .row-rank.bad { color: var(--bad); }

  .row-remove {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    font: inherit;
    font-size: 19px;
    line-height: 1;
    color: var(--text-faint);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
  }
  .row-remove:hover { color: var(--bad); border-color: var(--bad); }
  .row-remove:disabled { visibility: hidden; }
  .row-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .add-btn {
    width: 100%;
    margin-top: 12px;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 11px;
    cursor: pointer;
  }
  .add-btn:hover { border-color: var(--accent); }
  .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 18px;
    margin-top: 4px;
  }
  th, td {
    text-align: center;
    padding: 10px 6px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  th:nth-child(1), td:nth-child(1) { width: 42%; }
  th:nth-child(2), td:nth-child(2) { width: 30%; }
  th:nth-child(3), td:nth-child(3) { width: 28%; }
  th {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  tr.new-row td {
    color: var(--accent);
    font-weight: 700;
  }
  tr:last-child td { border-bottom: none; }

  .overflow { overflow-x: auto; }

  .finder-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .finder-row:last-child { margin-bottom: 0; }
  .finder-label {
    width: 130px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .finder-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    color: var(--text);
    text-align: right;
  }
  .finder-row input::placeholder { color: var(--text-faint); text-align: right; }
  .finder-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .finder-ratio {
    flex-shrink: 0;
    width: 70px;
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .finder-result {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .finder-result-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .finder-result-main {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .finder-result-row .label {
    font-size: 14px;
    color: var(--text-dim);
  }
  .finder-result-row .value {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .finder-result-row.win .value { color: var(--good); }
  .finder-result-detail {
    font-size: 12px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .preset-panel-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
  }
  .preset-list { display: flex; flex-direction: column; gap: 8px; }
  .preset-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .preset-row .preset-label {
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .preset-use-btn {
    flex-shrink: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .preset-use-btn:hover { border-color: var(--accent); }
  .preset-use-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  [hidden] { display: none !important; }
</style>

<div class="page">
  <div class="panel">
    <div class="tabs" id="tabs"></div>

    <div id="compare-panel">
      <div class="rows" id="rows"></div>
      <button class="add-btn" id="add-row" type="button">+ Add package</button>
    </div>
  </div>

  <div class="panel" id="table-panel">
    <div class="overflow">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="finder-inputs-panel" hidden>
    <div class="finder-row">
      <span class="finder-label">Best Coin Pack</span>
      <input type="number" id="finder-coin1" placeholder="PokéCoins" value="15500" min="0" inputmode="numeric" />
      <input type="number" id="finder-thb1" placeholder="Cash" value="1920" min="0" inputmode="numeric" />
      <span class="finder-ratio" id="finder-ratio1">—</span>
    </div>
    <div class="finder-row">
      <span class="finder-label">Item via Coins</span>
      <input type="number" id="finder-item2" placeholder="Item amount" value="3" min="0" inputmode="numeric" />
      <input type="number" id="finder-coin2" placeholder="PokéCoins" value="250" min="0" inputmode="numeric" />
    </div>
    <div class="finder-row">
      <span class="finder-label">Item via Cash</span>
      <input type="number" id="finder-item3" placeholder="Item amount" value="3" min="0" inputmode="numeric" />
      <input type="number" id="finder-thb3" placeholder="Cash" value="59" min="0" inputmode="numeric" />
    </div>
  </div>

  <div class="panel finder-result" id="finder-result-panel" hidden>
    <div class="finder-result-row" id="finder-via-coins-row">
      <div class="finder-result-main">
        <span class="label" id="finder-via-coins-label">Items via Coins</span>
        <span class="value" id="finder-via-coins">—</span>
      </div>
      <div class="finder-result-detail" id="finder-via-coins-detail"></div>
    </div>
    <div class="finder-result-row" id="finder-via-cash-row">
      <div class="finder-result-main">
        <span class="label" id="finder-via-cash-label">Items via Cash</span>
        <span class="value" id="finder-via-cash">—</span>
      </div>
      <div class="finder-result-detail" id="finder-via-cash-detail"></div>
    </div>
  </div>

  <div class="panel" id="preset-coins-panel" hidden>
    <div class="preset-panel-title">Item via Coins &mdash; saved packages</div>
    <div class="preset-list" id="preset-coins-list"></div>
  </div>

  <div class="panel" id="preset-cash-panel" hidden>
    <div class="preset-panel-title">Item via Cash &mdash; saved packages</div>
    <div class="preset-list" id="preset-cash-list"></div>
  </div>
</div>

<script>
  // Fixed category definitions, including the known bundles. Editing these
  // requires updating this file directly — ask for an update when a new
  // package needs adding.
  const categories = {
    coins: {
      tabLabel: 'PokéCoins / Cash',
      colA: 'PokéCoins',
      colB: 'Cash',
      higherIsBetter: true, // more coins per cash = better
      ratio: (a, b) => a / b,
      bundles: [
        { a: 15500, b: 1920 },
        { a: 5600, b: 769 },
        { a: 2700, b: 379 },
        { a: 1300, b: 189 },
        { a: 600, b: 99 },
        { a: 110, b: 19 },
      ],
    },
    raidCoins: {
      tabLabel: 'Raid Pass / PokéCoins',
      colA: 'Raid Passes',
      colB: 'PokéCoins',
      higherIsBetter: false, // fewer coins per pass = better
      ratio: (a, b) => b / a,
      bundles: [
        { a: 99, b: 5425 },
      ],
    },
    raidCash: {
      tabLabel: 'Raid Pass / Cash',
      colA: 'Raid Passes',
      colB: 'Cash',
      higherIsBetter: false, // fewer cash per pass = better
      ratio: (a, b) => b / a,
      bundles: [
        { a: 99, b: 769 },
      ],
    },
  };

  let current = 'coins';
  let rowSeq = 0;

  const tabsEl = document.getElementById('tabs');
  const rowsEl = document.getElementById('rows');
  const addRowBtn = document.getElementById('add-row');
  const tableHead = document.getElementById('table-head');
  const tableBody = document.getElementById('table-body');

  const comparePanel = document.getElementById('compare-panel');
  const tablePanel = document.getElementById('table-panel');
  const finderInputsPanel = document.getElementById('finder-inputs-panel');
  const finderResultPanel = document.getElementById('finder-result-panel');
  const presetCoinsPanel = document.getElementById('preset-coins-panel');
  const presetCashPanel = document.getElementById('preset-cash-panel');

  function selectTab(key) {
    current = key;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));

    const isFinder = key === 'finder';
    comparePanel.hidden = isFinder;
    tablePanel.hidden = isFinder;
    finderInputsPanel.hidden = !isFinder;
    finderResultPanel.hidden = !isFinder;
    presetCoinsPanel.hidden = !isFinder;
    presetCashPanel.hidden = !isFinder;

    if (isFinder) {
      renderFinder();
    } else {
      resetRows();
    }
  }

  Object.keys(categories).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === current ? ' active' : '');
    btn.textContent = categories[key].tabLabel;
    btn.dataset.key = key;
    btn.addEventListener('click', () => selectTab(key));
    tabsEl.appendChild(btn);
  });

  const finderTabBtn = document.createElement('button');
  finderTabBtn.className = 'tab';
  finderTabBtn.textContent = 'Value Finder';
  finderTabBtn.dataset.key = 'finder';
  finderTabBtn.addEventListener('click', () => selectTab('finder'));
  tabsEl.appendChild(finderTabBtn);

  function fmt(n) {
    return Number(n.toFixed(4)).toString();
  }

  function addRow() {
    const cat = categories[current];
    const id = ++rowSeq;

    const row = document.createElement('div');
    row.className = 'compare-row';
    row.dataset.id = id;
    row.innerHTML = `
      <input type="number" class="in-a" placeholder="${cat.colA}" min="0" inputmode="numeric" />
      <input type="number" class="in-b" placeholder="${cat.colB}" min="0" inputmode="numeric" />
      <span class="row-rank">—</span>
      <button class="row-remove" type="button" aria-label="Remove package">×</button>
    `;

    row.querySelector('.in-a').addEventListener('input', render);
    row.querySelector('.in-b').addEventListener('input', render);
    row.querySelector('.row-remove').addEventListener('click', () => {
      row.remove();
      updateRemoveButtons();
      render();
    });

    rowsEl.appendChild(row);
    updateRemoveButtons();
  }

  function resetRows() {
    rowsEl.innerHTML = '';
    addRow();
    render();
  }

  function updateRemoveButtons() {
    const rows = rowsEl.querySelectorAll('.compare-row');
    rows.forEach(row => {
      row.querySelector('.row-remove').disabled = rows.length === 1;
    });
  }

  addRowBtn.addEventListener('click', addRow);

  function render() {
    const cat = categories[current];

    const entries = Array.from(rowsEl.querySelectorAll('.compare-row')).map((row, i) => {
      const a = parseFloat(row.querySelector('.in-a').value);
      const b = parseFloat(row.querySelector('.in-b').value);
      const valid = a > 0 && b > 0;
      return { row, index: i + 1, a, b, valid, ratio: valid ? cat.ratio(a, b) : null };
    });

    const validEntries = entries.filter(e => e.valid);
    const multiple = validEntries.length > 1;

    // Combined, sorted list: known bundles + every valid entry.
    const combined = cat.bundles.map(bn => ({ ...bn, ratio: cat.ratio(bn.a, bn.b), isNew: false }));
    validEntries.forEach(e => combined.push({ a: e.a, b: e.b, ratio: e.ratio, isNew: true, index: e.index }));
    combined.sort((x, y) => cat.higherIsBetter ? y.ratio - x.ratio : x.ratio - y.ratio);

    // Table
    tableHead.innerHTML = `<tr><th>${cat.colA}</th><th>${cat.colB}</th><th>Ratio</th></tr>`;
    tableBody.innerHTML = '';
    combined.forEach(r => {
      const tr = document.createElement('tr');
      if (r.isNew) tr.className = 'new-row';
      const tag = r.isNew ? (multiple ? ` (#${r.index})` : ' (yours)') : '';
      tr.innerHTML = `<td>${r.a}${tag}</td><td>${r.b}</td><td>${fmt(r.ratio)}</td>`;
      tableBody.appendChild(tr);
    });

    // Per-row rank badges
    const total = combined.length;
    entries.forEach(e => {
      const badge = e.row.querySelector('.row-rank');
      if (!e.valid) {
        badge.textContent = '—';
        badge.className = 'row-rank';
        return;
      }
      const position = combined.findIndex(r => r.isNew && r.index === e.index) + 1;
      badge.textContent = `#${position}/${total}`;
      badge.className = 'row-rank ' + (position === 1 ? 'good' : position === total ? 'bad' : '');
    });
  }

  // --- Value Finder tab ---
  // Row1 "Best Coin Pack": Coins + Cash -> the pack you're planning to
  //   buy. Its cash price also sets the budget for a fair comparison.
  // Row2 "Item via Coins": how many of some item (not necessarily Raid
  //   Passes) a given amount of coins buys.
  // Row3 "Item via Cash": how many of that same item you can buy with cash
  //   directly, skipping coins entirely.
  // Result: spend that same cash budget both ways - buy the coin pack
  // then spend all the coins on the item, vs spend the cash on the item
  // directly - and show the whole items (no partial bundles) you'd walk
  // away with each way.
  const finderIds = ['finder-coin1', 'finder-thb1', 'finder-item2', 'finder-coin2', 'finder-item3', 'finder-thb3'];
  const finderInputs = {};
  finderIds.forEach(id => { finderInputs[id] = document.getElementById(id); });
  const finderRatio1El = document.getElementById('finder-ratio1');
  const finderViaCoinsEl = document.getElementById('finder-via-coins');
  const finderViaCoinsRow = document.getElementById('finder-via-coins-row');
  const finderViaCoinsLabelEl = document.getElementById('finder-via-coins-label');
  const finderViaCoinsDetailEl = document.getElementById('finder-via-coins-detail');
  const finderViaCashEl = document.getElementById('finder-via-cash');
  const finderViaCashRow = document.getElementById('finder-via-cash-row');
  const finderViaCashLabelEl = document.getElementById('finder-via-cash-label');
  const finderViaCashDetailEl = document.getElementById('finder-via-cash-detail');

  function renderFinder() {
    const coin1 = parseFloat(finderInputs['finder-coin1'].value);
    const thb1 = parseFloat(finderInputs['finder-thb1'].value);
    const item2 = parseFloat(finderInputs['finder-item2'].value);
    const coin2 = parseFloat(finderInputs['finder-coin2'].value);
    const item3 = parseFloat(finderInputs['finder-item3'].value);
    const thb3 = parseFloat(finderInputs['finder-thb3'].value);

    const coinRate = (coin1 > 0 && thb1 > 0) ? coin1 / thb1 : null; // coins per cash
    finderRatio1El.textContent = coinRate !== null ? fmt(coinRate) : '—';

    // Via coins: buy the pack (coin1 coins), then spend them on the item
    // in whole bundles of coin2.
    const viaCoins = (coin1 > 0 && item2 > 0 && coin2 > 0)
      ? Math.floor(coin1 / coin2) * item2
      : null;

    // Via cash: spend that same cash budget (thb1) on the item directly,
    // in whole bundles of thb3.
    const viaCash = (thb1 > 0 && item3 > 0 && thb3 > 0)
      ? Math.floor(thb1 / thb3) * item3
      : null;

    const budgetLabel = thb1 > 0 ? ` for ${fmt(thb1)} Cash` : '';
    finderViaCoinsLabelEl.textContent = `Items via Coins${budgetLabel}`;
    finderViaCashLabelEl.textContent = `Items via Cash${budgetLabel}`;

    finderViaCoinsEl.textContent = viaCoins !== null ? viaCoins : '—';
    finderViaCashEl.textContent = viaCash !== null ? viaCash : '—';

    // Buying the coin pack always costs its full cash price up front,
    // whatever's left over after spending coins on the item just sits
    // in your account as leftover coins (not leftover cash).
    if (viaCoins !== null) {
      const leftoverCoins = coin1 - Math.floor(coin1 / coin2) * coin2;
      finderViaCoinsDetailEl.textContent =
        `Spent ${fmt(thb1)} Cash • ${fmt(leftoverCoins)} Coins left over`;
    } else {
      finderViaCoinsDetailEl.textContent = '';
    }

    // Buying the item directly only spends whole bundles of thb3, so
    // some of the cash budget can end up unspent.
    if (viaCash !== null) {
      const cashSpent = Math.floor(thb1 / thb3) * thb3;
      const leftoverCash = thb1 - cashSpent;
      finderViaCashDetailEl.textContent =
        `Spent ${fmt(cashSpent)} Cash • ${fmt(leftoverCash)} Cash left over`;
    } else {
      finderViaCashDetailEl.textContent = '';
    }

    finderViaCoinsRow.classList.remove('win');
    finderViaCashRow.classList.remove('win');
    if (viaCoins !== null && viaCash !== null) {
      if (viaCoins > viaCash) finderViaCoinsRow.classList.add('win');
      else if (viaCash > viaCoins) finderViaCashRow.classList.add('win');
    }
  }

  // Saved packages: common bundles for rows 2 and 3, so they don't need
  // retyping every time. Editing these requires updating this file
  // directly - ask for an update when a new package needs adding.
  const coinPackagePresets = [
    { item: 3, coin: 250 },
    { item: 99, coin: 5425 },
  ];
  const cashPackagePresets = [
    { item: 3, thb: 59 },
    { item: 99, thb: 769 },
  ];

  const presetCoinsListEl = document.getElementById('preset-coins-list');
  const presetCashListEl = document.getElementById('preset-cash-list');

  function renderPresets() {
    presetCoinsListEl.innerHTML = '';
    coinPackagePresets.forEach(p => {
      const row = document.createElement('div');
      row.className = 'preset-row';
      row.innerHTML = `
        <span class="preset-label">${p.item} : ${p.coin}</span>
        <button class="preset-use-btn" type="button">Use</button>
      `;
      row.querySelector('.preset-use-btn').addEventListener('click', () => {
        finderInputs['finder-item2'].value = p.item;
        finderInputs['finder-coin2'].value = p.coin;
        renderFinder();
      });
      presetCoinsListEl.appendChild(row);
    });

    presetCashListEl.innerHTML = '';
    cashPackagePresets.forEach(p => {
      const row = document.createElement('div');
      row.className = 'preset-row';
      row.innerHTML = `
        <span class="preset-label">${p.item} : ${p.thb}</span>
        <button class="preset-use-btn" type="button">Use</button>
      `;
      row.querySelector('.preset-use-btn').addEventListener('click', () => {
        finderInputs['finder-item3'].value = p.item;
        finderInputs['finder-thb3'].value = p.thb;
        renderFinder();
      });
      presetCashListEl.appendChild(row);
    });
  }

  renderPresets();

  finderIds.forEach(id => finderInputs[id].addEventListener('input', renderFinder));
  renderFinder();

  resetRows();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('sw.js', { updateViaCache: 'none' })
        .then(reg => reg.update())
        .catch(() => {});
    });

    // sw.js calls skipWaiting()+clients.claim(), so once a new worker
    // activates, reload once to pick up the fresh assets instead of
    // requiring an uninstall/reinstall on mobile.
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }
</script>
